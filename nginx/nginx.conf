upstream gunicorn {
    server web:8000;
}

# Redirect bare HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name littlestarbank.com www.littlestarbank.com;

    # Allow Certbot ACME challenge through without redirecting
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name littlestarbank.com www.littlestarbank.com;

    ssl_certificate     /etc/letsencrypt/live/littlestarbank.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/littlestarbank.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers (Django also sets many of these, belt-and-suspenders)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;

    # Static files served directly by Nginx (faster than WhiteNoise)
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media uploads
    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    # Everything else → Gunicorn
    location / {
        proxy_pass         http://gunicorn;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

